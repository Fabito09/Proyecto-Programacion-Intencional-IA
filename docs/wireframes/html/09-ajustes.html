<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 32px; border-bottom: 1px solid #222;">
<nav aria-label="Secciones" style="display: flex; gap: 4px; flex-wrap: wrap;">
<a href="04-semana.html" style="height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; color: #b5b5b5; font-size: 14px; font-weight: 500; text-decoration: none;">Calendario</a>
<a href="08-categorias.html" style="height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; color: #b5b5b5; font-size: 14px; font-weight: 500; text-decoration: none;">Categorías</a>
<a href="09-ajustes.html" aria-current="page" style="height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; background: #fff; color: #000; font-size: 14px; font-weight: 600; text-decoration: none;">Ajustes</a>
</nav>
<span style="font-size: 14px; color: #b5b5b5;">Hola, María</span>
</header>
<main style="padding: 32px; display: flex; justify-content: center;">
<form style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 40px;">
<h1 style="margin: 0; font-weight: 800; font-size: 44px; letter-spacing: -0.02em; line-height: 1;">Ajustes</h1>
<section style="display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; padding-bottom: 10px; border-bottom: 2px solid #fff; font-size: 20px; font-weight: 700;">Su nombre</h2>
<label for="aj-nombre" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Nombre</label>
<input id="aj-nombre" type="text" value="María" style="font: inherit; font-size: 18px; color: #fff; background: transparent; border: 0; border-bottom: 1px solid #5a5a5a; padding: 8px 0; max-width: 360px;">
</section>
<section style="display: flex; flex-direction: column; gap: 16px;">
<h2 style="margin: 0; padding-bottom: 10px; border-bottom: 2px solid #fff; font-size: 20px; font-weight: 700;">Horario de trabajo</h2>
<fieldset style="border: 0; margin: 0; padding: 0;">
<legend style="font-size: 14px; color: #b5b5b5; padding: 0; margin-bottom: 10px;">Días laborales</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<label style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-size: 14px; font-weight: 600; padding: 0 12px; background: #fff; color: #000;"><input type="checkbox" checked style="accent-color: #5b6cff;">Lun</label>
<label style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-size: 14px; font-weight: 600; padding: 0 12px; background: #fff; color: #000;"><input type="checkbox" checked style="accent-color: #5b6cff;">Mar</label>
<label style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-size: 14px; font-weight: 600; padding: 0 12px; background: #fff; color: #000;"><input type="checkbox" checked style="accent-color: #5b6cff;">Mié</label>
<label style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-size: 14px; font-weight: 600; padding: 0 12px; background: #fff; color: #000;"><input type="checkbox" checked style="accent-color: #5b6cff;">Jue</label>
<label style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; font-size: 14px; font-weight: 600; padding: 0 12px; background: #fff; color: #000;"><input type="checkbox" checked style="accent-color: #5b6cff;">Vie</label>
<label style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #3a3a3a; border-radius: 999px; font-size: 14px; color: #d0d0d0; padding: 0 12px;"><input type="checkbox" style="accent-color: #5b6cff;">Sáb</label>
<label style="min-width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #3a3a3a; border-radius: 999px; font-size: 14px; color: #d0d0d0; padding: 0 12px;"><input type="checkbox" style="accent-color: #5b6cff;">Dom</label>
</div>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 420px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="aj-entrada" style="font-size: 14px; color: #b5b5b5;">Entrada</label>
<div style="display: flex; align-items: center; gap: 6px;"><select id="aj-entrada" aria-label="Entrada: horas" style="font: inherit; font-size: 16px; min-height: 44px; min-width: 84px; padding: 8px 12px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px;"><option>08</option></select><span style="color: #8a8a8a; font-weight: 700;">:</span><select aria-label="Entrada: minutos" style="font: inherit; font-size: 16px; min-height: 44px; min-width: 84px; padding: 8px 12px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px;"><option>00</option></select></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="aj-salida" style="font-size: 14px; color: #b5b5b5;">Salida</label>
<div style="display: flex; align-items: center; gap: 6px;"><select id="aj-salida" aria-label="Salida: horas" style="font: inherit; font-size: 16px; min-height: 44px; min-width: 84px; padding: 8px 12px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px;"><option>17</option></select><span style="color: #8a8a8a; font-weight: 700;">:</span><select aria-label="Salida: minutos" style="font: inherit; font-size: 16px; min-height: 44px; min-width: 84px; padding: 8px 12px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px;"><option>00</option></select></div>
</div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 4px;">
<h2 style="margin: 0 0 6px; padding-bottom: 10px; border-bottom: 2px solid #fff; font-size: 20px; font-weight: 700;">Recordatorios</h2>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #222;">
<label for="aj-r1" style="font-size: 16px; font-weight: 500;">Primer recordatorio</label>
<div style="display: flex; align-items: center; gap: 6px;"><select id="aj-r1" aria-label="Primer recordatorio: horas" style="font: inherit; font-size: 16px; min-height: 44px; min-width: 104px; padding: 8px 12px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px;"><option>08</option></select><span style="color: #8a8a8a; font-weight: 700;">:</span><select aria-label="Primer recordatorio: minutos" style="font: inherit; font-size: 16px; min-height: 44px; min-width: 84px; padding: 8px 12px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px;"><option>00</option></select></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #222;">
<label for="aj-r2" style="font-size: 16px; font-weight: 500;">Segundo recordatorio</label>
<div style="display: flex; align-items: center; gap: 6px;"><select id="aj-r2" aria-label="Segundo recordatorio: horas" style="font: inherit; font-size: 16px; min-height: 44px; min-width: 104px; padding: 8px 12px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px;"><option>Ninguno</option></select><span style="color: #8a8a8a; font-weight: 700;">:</span><select aria-label="Segundo recordatorio: minutos" style="font: inherit; font-size: 16px; min-height: 44px; min-width: 84px; padding: 8px 12px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px;"><option>--</option></select></div>
</div>
<p style="margin: 10px 0 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: #ffa53d;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path></svg>Los recordatorios aparecerán solo dentro de la app.</p>
</section>
<div style="display: flex; justify-content: flex-end;">
<button type="button" style="font: inherit; font-size: 16px; font-weight: 600; height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer;">Guardar cambios</button>
</div>
