<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Semana — Recordatorios</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#9aa4ff}a:hover{color:#c3c9ff}
</style>
</head>
<body>
<main style="width: 100%; min-height: 800px; box-sizing: border-box; background: #000; color: #fff; font-family: Inter, system-ui, sans-serif; padding: 56px 24px; display: flex; justify-content: center; align-items: center;">
<form style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 36px;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; gap: 8px;" aria-label="Paso 3 de 3">
<span style="height: 4px; flex: 1; border-radius: 2px; background: #fff;"></span>
<span style="height: 4px; flex: 1; border-radius: 2px; background: #fff;"></span>
<span style="height: 4px; flex: 1; border-radius: 2px; background: #fff;"></span>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 600; color: #8a8a8a; letter-spacing: 0.08em; text-transform: uppercase;">Paso 3 de 3</p>
<h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 44px; line-height: 1.05; letter-spacing: -0.02em;">¿A qué hora quiere recibir sus recordatorios?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #b5b5b5;">Cada recordatorio es un solo resumen de sus tareas del día. Deje una casilla vacía si no quiere ese recordatorio.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 0;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid #2a2a2a;">
<label for="r1" style="font-size: 17px; font-weight: 500;">Primer recordatorio</label>
<input id="r1" type="time" style="font: inherit; font-size: 18px; color: #fff; background: transparent; border: 0; border-bottom: 1px solid #5a5a5a; padding: 6px 0; width: 140px; color-scheme: dark;">
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid #2a2a2a;">
<label for="r2" style="font-size: 17px; font-weight: 500;">Segundo recordatorio</label>
<input id="r2" type="time" style="font: inherit; font-size: 18px; color: #fff; background: transparent; border: 0; border-bottom: 1px solid #5a5a5a; padding: 6px 0; width: 140px; color-scheme: dark;">
</div>
<p style="margin: 12px 0 0; font-size: 14px; color: #8a8a8a;">Casilla vacía = "Ninguno".</p>
</div>
<div style="display: flex; justify-content: flex-end;">
<button type="button" style="font: inherit; font-size: 16px; font-weight: 600; height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer;">Terminar</button>
</div>
</form>
</main>
</body>
</html>
