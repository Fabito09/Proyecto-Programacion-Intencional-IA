<body>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; background: #000; color: #fff; font-family: Inter, system-ui, sans-serif;">

<a href="08-categorias.html" aria-current="page" style="height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; background: #fff; color: #000; font-size: 14px; font-weight: 600; text-decoration: none;">Categorías</a>
<a href="09-ajustes.html" style="height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; color: #b5b5b5; font-size: 14px; font-weight: 500; text-decoration: none;">Ajustes</a>
</nav>
<span style="font-size: 14px; color: #b5b5b5;">Hola, María</span>
</header>
<main style="padding: 32px; display: flex; flex-direction: column; gap: 28px;">
<h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 800; font-size: 44px; letter-spacing: -0.02em; line-height: 1;">Categorías</h1>
<div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start;">
<section aria-label="Lista de categorías" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; border-top: 2px solid #fff;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #222; flex-wrap: wrap;">
<div style="display: flex; align-items: center; gap: 14px;"><span style="font-size: 14px; font-weight: 600; color: #000; background: #4df0a0; border-radius: 999px; padding: 4px 14px;">Clientes</span><span style="font-size: 14px; color: #8a8a8a;">9 tareas</span></div>
<div style="display: flex; gap: 6px;"><button type="button" style="font: inherit; font-size: 13px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #fff; cursor: pointer;">Editar</button><button type="button" style="font: inherit; font-size: 13px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #ff6b6b; background: transparent; color: #ff6b6b; cursor: pointer;">Eliminar</button></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #222; flex-wrap: wrap;">
<div style="display: flex; align-items: center; gap: 14px;"><span style="font-size: 14px; font-weight: 600; color: #000; background: #ffe14d; border-radius: 999px; padding: 4px 14px;">Reportes</span><span style="font-size: 14px; color: #8a8a8a;">6 tareas</span></div>
<div style="display: flex; gap: 6px;"><button type="button" style="font: inherit; font-size: 13px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #fff; cursor: pointer;">Editar</button><button type="button" style="font: inherit; font-size: 13px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #b5b5b5; cursor: pointer;">Eliminar</button></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #222; flex-wrap: wrap;">
<div style="display: flex; align-items: center; gap: 14px;"><span style="font-size: 14px; font-weight: 600; color: #000; background: #7cc4ff; border-radius: 999px; padding: 4px 14px;">Administrativo</span><span style="font-size: 14px; color: #8a8a8a;">3 tareas</span></div>
<div style="display: flex; gap: 6px;"><button type="button" style="font: inherit; font-size: 13px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #fff; cursor: pointer;">Editar</button><button type="button" style="font: inherit; font-size: 13px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #b5b5b5; cursor: pointer;">Eliminar</button></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #222; flex-wrap: wrap;">
<div style="display: flex; align-items: center; gap: 14px;"><span style="font-size: 14px; font-weight: 600; color: #000; background: #cfcfcf; border-radius: 999px; padding: 4px 14px;">General</span><span style="font-size: 14px; color: #8a8a8a;">2 tareas</span></div>
<div style="display: flex; gap: 6px;"><button type="button" style="font: inherit; font-size: 13px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #fff; cursor: pointer;">Editar</button><button type="button" style="font: inherit; font-size: 13px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #333; background: transparent; color: #b5b5b5; cursor: pointer;">Eliminar</button></div>
</div>

<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<form style="display: flex; flex-direction: column; gap: 18px; padding: 24px; border: 1px solid #2a2a2a; border-radius: 16px;">
<h2 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-size: 22px; font-weight: 700;">Nueva categoría</h2>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="nc-nombre" style="font-size: 14px; color: #b5b5b5;">Nombre</label>
<input id="nc-nombre" type="text" placeholder="Ej. Proyectos" style="font: inherit; font-size: 17px; color: #fff; background: transparent; border: 0; border-bottom: 1px solid #5a5a5a; padding: 8px 0;">
</div>
<fieldset style="border: 0; margin: 0; padding: 0;">
<legend style="font-size: 14px; color: #b5b5b5; padding: 0; margin-bottom: 10px;">Color</legend>
<div style="display: flex; gap: 10px; flex-wrap: wrap;">
<label style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid #fff;"><input type="radio" name="color" checked aria-label="Azul" style="position: absolute; opacity: 0;"><span style="width: 30px; height: 30px; border-radius: 999px; background: #7cc4ff;"></span></label>
<label style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid transparent;"><input type="radio" name="color" aria-label="Verde" style="position: absolute; opacity: 0;"><span style="width: 30px; height: 30px; border-radius: 999px; background: #4df0a0;"></span></label>
<label style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid transparent;"><input type="radio" name="color" aria-label="Amarillo" style="position: absolute; opacity: 0;"><span style="width: 30px; height: 30px; border-radius: 999px; background: #ffe14d;"></span></label>
<label style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid transparent;"><input type="radio" name="color" aria-label="Rojo" style="position: absolute; opacity: 0;"><span style="width: 30px; height: 30px; border-radius: 999px; background: #ff9a9a;"></span></label>
<label style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid transparent;"><input type="radio" name="color" aria-label="Morado" style="position: absolute; opacity: 0;"><span style="width: 30px; height: 30px; border-radius: 999px; background: #c9a7ff;"></span></label>
<label style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid transparent;"><input type="radio" name="color" aria-label="Gris" style="position: absolute; opacity: 0;"><span style="width: 30px; height: 30px; border-radius: 999px; background: #cfcfcf;"></span></label>
</div>
</fieldset>
<button type="button" style="align-self: flex-end; font: inherit; font-size: 15px; font-weight: 600; height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer;">Guardar</button>
</form>
<section role="alertdialog" aria-labelledby="borrar-titulo" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border: 1px solid #5a2a2a; border-radius: 16px; background: #120a0a;">
<h2 id="borrar-titulo" style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-size: 22px; font-weight: 700;">Eliminar «Clientes»</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #d0d0d0;">Esta categoría tiene 9 tareas. Elija a qué categoría moverlas antes de eliminarla.</p>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="destino" style="font-size: 14px; color: #b5b5b5;">Mover tareas a</label>
<select id="destino" style="font: inherit; font-size: 15px; height: 44px; color: #fff; background: #111; border: 1px solid #3a3a3a; border-radius: 10px; padding: 0 12px;"><option>Elija una categoría</option><option>Reportes</option><option>Administrativo</option><option>General</option></select>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap;">
<button type="button" style="font: inherit; font-size: 15px; font-weight: 500; height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: transparent; color: #b5b5b5; cursor: pointer;">Cancelar</button>
<button type="button" style="font: inherit; font-size: 15px; font-weight: 600; height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #ff6b6b; color: #000; cursor: pointer;">Mover y eliminar</button>
</div>
</section>
</div>
